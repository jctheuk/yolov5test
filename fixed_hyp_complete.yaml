# Complete fix for classification training
lr0: 0.01              # 10x higher learning rate
lrf: 0.1               # Final LR factor
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3.0
warmup_momentum: 0.8
warmup_bias_lr: 0.1

# Detection losses (minimal for classification-focused training)
box: 0.0               # Disable box loss
cls: 0.0               # Disable classification detection loss
cls_pw: 1.0
obj: 0.0               # Disable object loss
obj_pw: 1.0

# Classification-specific parameters
cls_task: 1.0          # Enable classification task loss
label_smoothing: 0.1   # Add label smoothing

# Data augmentation
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 5.0
translate: 0.1
scale: 0.0
shear: 0.0
perspective: 0.0
flipud: 0.0
fliplr: 0.5            # Enable horizontal flip
mosaic: 0.5            # Enable mosaic augmentation
mixup: 0.1             # Enable mixup augmentation
copy_paste: 0.0

# Training parameters
iou_t: 0.2
anchor_t: 4.0
fl_gamma: 0.0
