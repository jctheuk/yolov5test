# YOLOv5WithClassification 修復版超參數
# 解決 NaN 錯誤和過擬合問題

# 學習率設置 (降低以避免 NaN)
lr0: 0.001  # 初始學習率 (從 0.01 降低)
lrf: 0.01   # 最終學習率 (從 0.1 降低)
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3.0
warmup_momentum: 0.8
warmup_bias_lr: 0.1

# 損失函數權重
box: 0.05
cls: 0.5
cls_pw: 1.0
obj: 1.0
obj_pw: 1.0
iou_t: 0.20
anchor_t: 4.0
fl_gamma: 0.0

# 分類任務設置 (降低權重以減少過擬合)
cls_task: 0.1  # 從 0.3 降低到 0.1
cls_focal_gamma: 1.5  # 從 2.0 降低到 1.5
cls_focal_alpha: [0.33, 0.33, 0.34]

# 正則化設置
dropout: 0.3  # 增加 dropout
label_smoothing: 0.1

# 數據增強 (減少以避免過擬合)
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 0.0
translate: 0.1
scale: 0.5
shear: 0.0
perspective: 0.0
flipud: 0.0
fliplr: 0.5
mosaic: 1.0
mixup: 0.0
copy_paste: 0.0

# 其他設置
temperature: 1.0