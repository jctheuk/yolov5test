# YOLOv5 🚀 by Ultralytics, AGPL-3.0 license
# Improved hyperparameters for regurgitation detection and classification
# Keeping IoU threshold unchanged but optimizing other parameters

# Multi-task learning parameters
cls_task: 0.3  # Weight for classification task loss in dual loss computation

# Learning rate parameters (improved)
lr0: 0.01  # initial learning rate (increased from 0.001 for better convergence)
lrf: 0.1  # final OneCycleLR learning rate (increased for better convergence)
momentum: 0.937  # SGD momentum/Adam beta1
weight_decay: 0.0005  # optimizer weight decay

# Warmup parameters
warmup_epochs: 3.0  # warmup epochs (reduced from 5.0 for faster convergence)
warmup_momentum: 0.8  # warmup initial momentum
warmup_bias_lr: 0.1  # warmup initial bias lr

# Loss weights (optimized for multi-task)
box: 0.05  # box loss gain (reduced from 0.1 for better balance)
cls: 0.5  # cls loss gain (increased from 0.3 for better classification)
cls_pw: 1.0  # cls BCELoss positive_weight
obj: 1.0  # obj loss gain
obj_pw: 1.0  # obj BCELoss positive_weight

# IoU and anchor parameters (KEEPING UNCHANGED)
iou_t: 0.20  # IoU training threshold (keeping unchanged as requested)
anchor_t: 4.0  # anchor-multiple threshold

# Focal loss
fl_gamma: 1.5  # focal loss gamma

# Augmentation parameters (balanced for medical images)
hsv_h: 0.015  # image HSV-Hue augmentation (fraction) - increased from 0.01
hsv_s: 0.4  # image HSV-Saturation augmentation (fraction) - increased from 0.3
hsv_v: 0.3  # image HSV-Value augmentation (fraction) - increased from 0.2
degrees: 10.0  # image rotation (+/- deg) - increased from 5.0 for better generalization
translate: 0.1  # image translation (+/- fraction) - increased from 0.05
scale: 0.5  # image scale (+/- gain) - increased from 0.3
shear: 0.0  # image shear (+/- deg) - disabled for medical images
perspective: 0.0  # image perspective (+/- fraction) - disabled for medical images
flipud: 0.0  # image flip up-down (probability) - disabled for medical images
fliplr: 0.5  # image flip left-right (probability) - increased from 0.3
mosaic: 0.0  # image mosaic (probability) - disabled for medical images
mixup: 0.0  # image mixup (probability) - disabled for medical images
copy_paste: 0.0  # segment copy-paste (probability) - disabled for medical images
