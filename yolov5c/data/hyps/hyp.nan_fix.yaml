# Fixed hyperparameters for regurgitation detection and classification
# Optimized to prevent NaN errors during training

# Multi-task learning parameters - REDUCED CLASSIFICATION WEIGHT
cls_task: 0.3  # Reduced classification weight to prevent gradient explosion

# Learning rate parameters (REDUCED for stability)
lr0: 0.001  # initial learning rate (reduced from 0.01)
lrf: 0.1  # final OneCycleLR learning rate
momentum: 0.937  # SGD momentum/Adam beta1
weight_decay: 0.0005  # optimizer weight decay

# Warmup parameters (INCREASED for stability)
warmup_epochs: 15.0  # warmup epochs (increased for better stability)
warmup_momentum: 0.8  # warmup initial momentum
warmup_bias_lr: 0.1  # warmup initial bias lr

# Loss weights (REDUCED for stability)
box: 0.05  # box loss gain (standard)
cls: 0.3  # cls loss gain (reduced from 0.5)
cls_pw: 1.0  # cls BCELoss positive_weight
obj: 0.7  # obj loss gain (reduced from 1.0)
obj_pw: 1.0  # obj BCELoss positive_weight

# IoU and anchor parameters
iou_t: 0.20  # IoU training threshold
anchor_t: 4.0  # anchor-multiple threshold

# Focal loss (REDUCED for stability)
fl_gamma: 1.0  # focal loss gamma (reduced from 1.5)

# Augmentation parameters (MINIMAL for medical images)
hsv_h: 0.015  # image HSV-Hue augmentation (fraction)
hsv_s: 0.2  # image HSV-Saturation augmentation (fraction) - reduced
hsv_v: 0.2  # image HSV-Value augmentation (fraction) - reduced
degrees: 5.0  # image rotation (+/- deg) - reduced for medical images
translate: 0.05  # image translation (+/- fraction) - reduced
scale: 0.3  # image scale (+/- gain) - reduced
shear: 0.0  # image shear (+/- deg) - disabled for medical images
perspective: 0.0  # image perspective (+/- fraction) - disabled for medical images
flipud: 0.0  # image flip up-down (probability) - disabled for medical images
fliplr: 0.3  # image flip left-right (probability) - reduced
mosaic: 0.0  # image mosaic (probability) - disabled for medical images
mixup: 0.0  # image mixup (probability) - disabled for medical images
copy_paste: 0.0  # segment copy-paste (probability) - disabled for medical images
