# YOLOv5 🚀 by Ultralytics, AGPL-3.0 license
# Conservative hyperparameters to fix NaN at epoch 267
# Very conservative settings to prevent gradient explosion

# Multi-task learning parameters (very conservative)
classification_weight: 0.01  # Extremely low weight
cls_task: 0.01  # Extremely low classification task weight

# Learning rate parameters (very conservative)
lr0: 0.0001  # Very low initial learning rate
lrf: 0.001  # Very low final learning rate
momentum: 0.9  # Reduced momentum
weight_decay: 0.002  # Increased weight decay

# Warmup parameters (extended)
warmup_epochs: 15.0  # Very long warmup
warmup_momentum: 0.8
warmup_bias_lr: 0.001  # Very low warmup bias lr

# Loss weights (very conservative)
box: 0.05  # box loss gain
cls: 0.1  # cls loss gain (very low)
cls_pw: 1.0  # cls BCELoss positive_weight
obj: 0.3  # obj loss gain (very low)
obj_pw: 1.0  # obj BCELoss positive_weight

# IoU and anchor parameters
iou_t: 0.20
anchor_t: 4.0

# Focal loss (disabled)
fl_gamma: 0.0  # focal loss gamma (disabled)

# Augmentation parameters (all disabled)
hsv_h: 0.0
hsv_s: 0.0
hsv_v: 0.0
degrees: 0.0
translate: 0.0
scale: 0.0
shear: 0.0
perspective: 0.0
flipud: 0.0
fliplr: 0.0
mosaic: 0.0
mixup: 0.0
copy_paste: 0.0

# Label smoothing (increased)
label_smoothing: 0.3  # High label smoothing
