# MEMORY-OPTIMIZED hyperparameters for YOLOv5lc Large models
# Designed to reduce GPU memory pressure while maintaining batch-size 128
# Target: Stay well below 32GB limit to prevent numerical instability

# Optimizer hyperparameters (Memory-conscious)
lr0: 0.01  # Standard learning rate (no change needed)
lrf: 0.1  # final OneCycleLR learning rate
momentum: 0.937  # SGD momentum
weight_decay: 0.005  # optimizer weight decay
warmup_epochs: 3.0  # REDUCED warmup to save memory on scheduler states
warmup_momentum: 0.8  # warmup initial momentum
warmup_bias_lr: 0.1  # warmup initial bias lr

# Loss hyperparameters (Standard)
box: 0.05  # box loss gain
cls: 0.5  # cls loss gain
cls_pw: 1.0  # cls BCELoss positive_weight
obj: 1.0  # obj loss gain
obj_pw: 1.0  # obj BCELoss positive_weight
iou_t: 0.2  # IoU training threshold
anchor_t: 4.0  # anchor-multiple threshold
fl_gamma: 0.0  # focal loss gamma

# Classification Task hyperparameters
cls_task: 1.0  # classification weight
label_smoothing: 0.0  # DISABLED to reduce computation
temperature: 1.0  # temperature for softmax

# Anatomical Constraints (DISABLED)
use_anatomical_constraints: false

# MEMORY-OPTIMIZED Image augmentation
# Reduce augmentation to lower memory pressure
hsv_h: 0.01  # REDUCED HSV augmentation
hsv_s: 0.3   # REDUCED saturation augmentation  
hsv_v: 0.2   # REDUCED value augmentation
degrees: 0.0 # DISABLED rotation to save memory
translate: 0.05  # REDUCED translation
scale: 0.3   # REDUCED scale augmentation
shear: 0.0   # DISABLED
perspective: 0.0  # DISABLED
flipud: 0.0  # DISABLED
fliplr: 0.0  # DISABLED for medical images anyway
mosaic: 0.0  # DISABLED - saves significant memory
mixup: 0.0   # DISABLED - saves memory
copy_paste: 0.0  # DISABLED

# CUSTOM MEMORY OPTIMIZATION FLAGS
# Target: Keep GPU usage below 30GB (94%) instead of 31.9GB (99.7%)
memory_efficient: true      # Enable memory-efficient training mode
gradient_checkpointing: false # DISABLED - adds instability
reduce_precision: false     # Keep current precision
clear_cache_freq: 5         # Clear CUDA cache every 5 batches (aggressive)
disable_amp_if_critical: true # Disable AMP if memory >98%
accumulation_steps: 1       # No gradient accumulation to reduce memory
