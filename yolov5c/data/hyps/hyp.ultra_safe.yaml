# Ultra-safe hyperparameters for stable training

# Multi-task learning parameters - VERY CONSERVATIVE
cls_task: 0.1  # Significantly reduced from 0.517

# Learning rate parameters (very conservative)
lr0: 0.001  # Reduced from 0.01
lrf: 0.1  # final OneCycleLR learning rate
momentum: 0.937  # SGD momentum/Adam beta1
weight_decay: 0.0005  # optimizer weight decay

# Warmup parameters (extended)
warmup_epochs: 20.0  # Increased from 10.0
warmup_momentum: 0.8  # warmup initial momentum
warmup_bias_lr: 0.1  # warmup initial bias lr

# Loss weights (very conservative)
box: 0.05  # box loss gain (standard)
cls: 0.3  # Reduced from 0.5
cls_pw: 1.0  # cls BCELoss positive_weight
obj: 0.7  # Reduced from 1.0
obj_pw: 1.0  # obj BCELoss positive_weight

# IoU and anchor parameters
iou_t: 0.20  # IoU training threshold
anchor_t: 4.0  # anchor-multiple threshold

# Focal loss (disabled for stability)
fl_gamma: 0.0  # Reduced from 1.5

# Augmentation parameters (minimal for medical images)
hsv_h: 0.0  # Disabled
hsv_s: 0.0  # Disabled
hsv_v: 0.0  # Disabled
degrees: 0.0  # Disabled
translate: 0.0  # Disabled
scale: 0.0  # Disabled
shear: 0.0  # Disabled
perspective: 0.0  # Disabled
flipud: 0.0  # Disabled
fliplr: 0.0  # Disabled
mosaic: 0.0  # Disabled
mixup: 0.0  # Disabled
copy_paste: 0.0  # Disabled
