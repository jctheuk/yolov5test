# YOLOv5 🚀 by Ultralytics, AGPL-3.0 license
# ClassV5 hyperparameters - Based on successful V26 but with fixed Focal Loss
# Restoring high mAP performance (70-80%) with stable training

# Multi-task learning parameters - RESTORED FROM V26
cls_task: 0.1  # Restored from V26 (was 0.2 in V4)

# Learning rate parameters - RESTORED FROM V26
lr0: 0.01  # Restored from V26 (was 0.005 in V4)
lrf: 0.1  # Restored from V26
momentum: 0.937  # SGD momentum/Adam beta1
weight_decay: 0.0005  # optimizer weight decay 5e-4

# Warmup parameters - RESTORED FROM V26
warmup_epochs: 10.0  # Restored from V26 (was 8.0 in V4)
warmup_momentum: 0.8  # warmup initial momentum
warmup_bias_lr: 0.1  # warmup initial bias lr

# Loss weights - RESTORED FROM V26
box: 0.03  # Restored from V26 (was 0.04 in V4)
cls: 0.3  # Restored from V26 (was 0.4 in V4)
cls_pw: 1.0  # cls BCELoss positive_weight
obj: 0.7  # Restored from V26 (was 0.8 in V4)
obj_pw: 1.0  # obj BCELoss positive_weight

# IoU and anchor parameters - KEEP ORIGINAL YOLOv5 VALUES
iou_t: 0.20  # IoU training threshold
anchor_t: 4.0  # anchor-multiple threshold

# Focal loss - RESTORED FROM V26 BUT WITH STABILITY FIXES
fl_gamma: 1.5  # Restored from V26 (was 0.0 in V4)
# Classification parameters (STANDARD CROSSENTROPY - NO FOCAL LOSS)
label_smoothing: 0.1 # label smoothing epsilon

# Regularization parameters - MINIMAL FOR HIGH PERFORMANCE
max_grad_norm: 1.0 # Increased from V4 (was 0.5)

# Temperature for softmax sharpness
temperature: 1.0  # Standard temperature for softmax

# Augmentation parameters - RESTORED FROM V26 FOR HIGH PERFORMANCE
hsv_h: 0.015  # Restored from V26
hsv_s: 0.4  # Restored from V26
hsv_v: 0.3  # Restored from V26
degrees: 10.0  # Restored from V26
translate: 0.1  # Restored from V26
scale: 0.5  # Restored from V26
shear: 0.0
perspective: 0.0
flipud: 0.0
fliplr: 0.0
mosaic: 0.0
mixup: 0.0
copy_paste: 0.0
