# YOLOv5 🚀 by Ultralytics, AGPL-3.0 license
# ClassV2 hyperparameters - ULTRA-SAFE configuration to solve NaN and overfitting
# Based on hyp.scratch-low.yaml with conservative modifications for medical images

# Multi-task learning parameters - REDUCED FOR STABILITY
cls_task: 0.1  # Reduced weight to prevent overfitting
  
# Learning rate parameters - ULTRA-CONSERVATIVE FOR STABILITY
lr0: 0.003  # Significantly reduced to prevent NaN (ultra-safe)
lrf: 0.01  # final OneCycleLR learning rate (lr0 * lrf) - KEEP ORIGINAL
momentum: 0.937  # SGD momentum/Adam beta1 - KEEP ORIGINAL
weight_decay: 0.0005  # optimizer weight decay 5e-4 - KEEP ORIGINAL

# Warmup parameters - KEEP ORIGINAL YOLOv5 VALUES
warmup_epochs: 3.0  # warmup epochs (fractions ok) - KEEP ORIGINAL
warmup_momentum: 0.8  # warmup initial momentum - KEEP ORIGINAL
warmup_bias_lr: 0.1  # warmup initial bias lr - KEEP ORIGINAL

# Loss weights - KEEP ORIGINAL YOLOv5 VALUES
box: 0.05  # box loss gain - KEEP ORIGINAL
cls: 0.5  # cls loss gain - KEEP ORIGINAL
cls_pw: 1.0  # cls BCELoss positive_weight - KEEP ORIGINAL
obj: 1.0  # obj loss gain (scale with pixels) - KEEP ORIGINAL
obj_pw: 1.0  # obj BCELoss positive_weight - KEEP ORIGINAL

# IoU and anchor parameters - KEEP ORIGINAL YOLOv5 VALUES
iou_t: 0.20  # IoU training threshold - KEEP ORIGINAL
anchor_t: 4.0  # anchor-multiple threshold - KEEP ORIGINAL

# Focal loss - KEEP ORIGINAL (DISABLED)
fl_gamma: 0.0  # focal loss gamma (efficientDet default gamma=1.5) - KEEP ORIGINAL

# Classification parameters (STANDARD CROSSENTROPY - NO FOCAL LOSS)
label_smoothing: 0.1 # label smoothing epsilon

# Augmentation parameters - DISABLE FOR MEDICAL IMAGES (ONLY CHANGE)
# Medical images require preservation of original features for accurate diagnosis
hsv_h: 0.0  # image HSV-Hue augmentation (fraction) - DISABLED for medical
hsv_s: 0.0  # image HSV-Saturation augmentation (fraction) - DISABLED for medical
hsv_v: 0.0  # image HSV-Value augmentation (fraction) - DISABLED for medical
degrees: 0.0  # image rotation (+/- deg) - DISABLED for medical images
translate: 0.0  # image translation (+/- fraction) - DISABLED for medical
scale: 0.0  # image scale (+/- gain) - DISABLED for medical
shear: 0.0  # image shear (+/- deg) - DISABLED for medical images
perspective: 0.0  # image perspective (+/- fraction) - DISABLED for medical
flipud: 0.0  # image flip up-down (probability) - DISABLED for medical images
fliplr: 0.0  # image flip left-right (probability) - DISABLED for medical images
mosaic: 0.0  # image mosaic (probability) - DISABLED for medical images
mixup: 0.0  # image mixup (probability) - DISABLED for medical images
copy_paste: 0.0  # segment copy-paste (probability) - DISABLED for medical images
