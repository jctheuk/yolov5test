# NO AUGMENTATION hyperparameters for medical image training
# Completely disabled all image augmentations for medical images

# Multi-task learning parameters
cls_task: 0.1  # Classification weight

# Learning rate parameters
lr0: 0.01  # initial learning rate
lrf: 0.1  # final OneCycleLR learning rate
momentum: 0.937  # SGD momentum/Adam beta1
weight_decay: 0.0005  # optimizer weight decay

# Warmup parameters
warmup_epochs: 10.0  # warmup epochs
warmup_momentum: 0.8  # warmup initial momentum
warmup_bias_lr: 0.1  # warmup initial bias lr

# Loss weights
box: 0.03  # box loss gain
cls: 0.3  # cls loss gain
cls_pw: 1.0  # cls BCELoss positive_weight
obj: 0.7  # obj loss gain
obj_pw: 1.0  # obj BCELoss positive_weight

# IoU and anchor parameters
iou_t: 0.20  # IoU training threshold
anchor_t: 4.0  # anchor-multiple threshold

# Focal loss
fl_gamma: 1.5  # focal loss gamma

# AUGMENTATION PARAMETERS - ALL DISABLED FOR MEDICAL IMAGES
hsv_h: 0.0  # image HSV-Hue augmentation (fraction) - DISABLED
hsv_s: 0.0  # image HSV-Saturation augmentation (fraction) - DISABLED
hsv_v: 0.0  # image HSV-Value augmentation (fraction) - DISABLED
degrees: 0.0  # image rotation (+/- deg) - DISABLED
translate: 0.0  # image translation (+/- fraction) - DISABLED
scale: 0.0  # image scale (+/- gain) - DISABLED
shear: 0.0  # image shear (+/- deg) - DISABLED
perspective: 0.0  # image perspective (+/- fraction) - DISABLED
flipud: 0.0  # image flip up-down (probability) - DISABLED
fliplr: 0.0  # image flip left-right (probability) - DISABLED
mosaic: 0.0  # image mosaic (probability) - DISABLED
mixup: 0.0  # image mixup (probability) - DISABLED
copy_paste: 0.0  # segment copy-paste (probability) - DISABLED
