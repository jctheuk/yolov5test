# YOLOv5 🚀 by Ultralytics, AGPL-3.0 license
# Regularized hyperparameters to prevent overfitting on balanced dataset
# Higher regularization for small dataset

# Multi-task learning parameters
cls_task: 0.15

# Learning rate parameters - LOWER LEARNING RATE
lr0: 0.005  # Reduced from 0.01 to prevent overfitting
lrf: 0.05   # Reduced final learning rate
momentum: 0.937
weight_decay: 0.001  # INCREASED weight decay for stronger regularization

# Warmup parameters
warmup_epochs: 10.0
warmup_momentum: 0.8
warmup_bias_lr: 0.1

# Loss weights
box: 0.05
cls: 0.5
cls_pw: 1.0
obj: 1.0
obj_pw: 1.0

# IoU and anchor parameters
iou_t: 0.20
anchor_t: 4.0

# Focal loss - ENABLED for better generalization
fl_gamma: 1.5
cls_focal_gamma: 1.0
cls_focal_alpha: [1.0, 1.0, 1.0]

# Regularization parameters - INCREASED
dropout: 0.3  # INCREASED dropout
label_smoothing: 0.1  # INCREASED label smoothing
max_grad_norm: 0.5  # STRONGER gradient clipping

# Temperature for softmax sharpness
temperature: 1.0

# Augmentation parameters - LIGHT AUGMENTATION FOR MEDICAL IMAGES
hsv_h: 0.01   # Very light hue variation
hsv_s: 0.1    # Light saturation variation
hsv_v: 0.1    # Light value variation
degrees: 2.0  # Very small rotation
translate: 0.05  # Small translation
scale: 0.1    # Small scale variation
shear: 0.0
perspective: 0.0
flipud: 0.0
fliplr: 0.0
mosaic: 0.0
mixup: 0.0
copy_paste: 0.0







