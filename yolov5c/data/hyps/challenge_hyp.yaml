# YOLOv5 Classification-Only Hyperparameters
# Designed to match the successful classify/ setup (95% accuracy)
# Adapted for classification task with detection losses disabled

# Learning rate settings (matching successful classify/ setup)
lr0: 0.001  # Initial learning rate (same as successful classify/)
lrf: 0.1    # Final learning rate factor (lr0 * lrf = final lr)

# Optimizer settings (matching successful classify/)
momentum: 0.937       # SGD momentum/Adam beta1
weight_decay: 0.0005  # Optimizer weight decay

# Warmup settings
warmup_epochs: 3.0
warmup_momentum: 0.8
warmup_bias_lr: 0.1

# Detection loss weights (DISABLED for classification-only)
box: 0.0   # Box loss gain (disabled)
cls: 0.0   # Detection cls loss gain (disabled)
obj: 0.0   # Object loss gain (disabled)

# Additional detection parameters (set to defaults, won't be used)
cls_pw: 1.0
obj_pw: 1.0
iou_t: 0.2
anchor_t: 4.0
fl_gamma: 0.0

# Classification-specific parameters
cls_task: 1.0         # Classification task loss weight (HIGH priority)
label_smoothing: 0.1  # Label smoothing (same as successful classify/)

# Data augmentation (DISABLED per project rules for medical images)
hsv_h: 0.0
hsv_s: 0.0
hsv_v: 0.0
degrees: 0.0
translate: 0.0
scale: 0.0
shear: 0.0
perspective: 0.0
flipud: 0.0
fliplr: 0.0
mosaic: 0.0
mixup: 0.0
copy_paste: 0.0

