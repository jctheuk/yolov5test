# YOLOv5 🚀 by Ultralytics, AGPL-3.0 license
# ClassV3 hyperparameters - Optimized to fix detection performance and overfitting issues
# Based on historical analysis and successful configurations

# Multi-task learning parameters - BALANCED FOR STABILITY
cls_task: 0.15  # Reduced from 0.2 to prevent overfitting

# Learning rate parameters - CONSERVATIVE FOR STABILITY
lr0: 0.003  # Reduced from 0.008 to prevent gradient explosion
lrf: 0.01  # final OneCycleLR learning rate (lr0 * lrf)
momentum: 0.937  # SGD momentum/Adam beta1
weight_decay: 0.0005  # optimizer weight decay 5e-4

# Warmup parameters - EXTENDED FOR STABILITY
warmup_epochs: 5.0  # Extended warmup for better stability
warmup_momentum: 0.8  # warmup initial momentum
warmup_bias_lr: 0.1  # warmup initial bias lr

# Loss weights - REDUCED TO PREVENT GRADIENT EXPLOSION
box: 0.03  # Reduced box loss gain
cls: 0.3  # Reduced cls loss gain
cls_pw: 1.0  # cls BCELoss positive_weight
obj: 0.7  # Reduced obj loss gain
obj_pw: 1.0  # obj BCELoss positive_weight

# IoU and anchor parameters - KEEP ORIGINAL YOLOv5 VALUES
iou_t: 0.20  # IoU training threshold
anchor_t: 4.0  # anchor-multiple threshold

# Focal loss - DISABLED TO PREVENT NUMERICAL INSTABILITY
fl_gamma: 0.0  # focal loss gamma (disabled)

# Classification parameters (STANDARD CROSSENTROPY - NO FOCAL LOSS)
label_smoothing: 0.1 # label smoothing epsilon

# Gradient clipping - CRITICAL FOR STABILITY
max_grad_norm: 0.3  # Strict gradient clipping to prevent NaN

# Augmentation parameters - ALL DISABLED FOR MEDICAL IMAGES
# Medical images require preservation of original features for accurate diagnosis
hsv_h: 0.0  # image HSV-Hue augmentation (fraction) - DISABLED for medical
hsv_s: 0.0  # image HSV-Saturation augmentation (fraction) - DISABLED for medical
hsv_v: 0.0  # image HSV-Value augmentation (fraction) - DISABLED for medical
degrees: 0.0  # image rotation (+/- deg) - DISABLED for medical images
translate: 0.0  # image translation (+/- fraction) - DISABLED for medical
scale: 0.0  # image scale (+/- gain) - DISABLED for medical
shear: 0.0  # image shear (+/- deg) - DISABLED for medical images
perspective: 0.0  # image perspective (+/- fraction) - DISABLED for medical
flipud: 0.0  # image flip up-down (probability) - DISABLED for medical images
fliplr: 0.0  # image flip left-right (probability) - DISABLED for medical images
mosaic: 0.0  # image mosaic (probability) - DISABLED for medical images
mixup: 0.0  # image mixup (probability) - DISABLED for medical images
copy_paste: 0.0  # segment copy-paste (probability) - DISABLED for medical images
