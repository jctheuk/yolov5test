# Fix for yolov5c to match successful classify/ performance
lr0: 0.001
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3.0
warmup_momentum: 0.8
warmup_bias_lr: 0.1

# Disable detection losses (as you already did)
box: 0.0
cls: 0.0
obj: 0.0

# Classification-specific parameters
cls_task: 1.0
label_smoothing: 0.1

# Data augmentation (minimal to match successful setup)
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 5.0
translate: 0.1
scale: 0.0
shear: 0.0
perspective: 0.0
flipud: 0.0
fliplr: 0.0  # Keep minimal like successful setup
mosaic: 0.0
mixup: 0.0
copy_paste: 0.0

# Training parameters
iou_t: 0.2
anchor_t: 4.0
fl_gamma: 0.0
