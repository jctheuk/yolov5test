# YOLOv5 Classification-Only Hyperparameters
# FIXED for PSAX bias bug using class weights

# Learning rate settings
lr0: 0.001
lrf: 0.1

# Optimizer settings
momentum: 0.937
weight_decay: 0.0005

# Warmup settings
warmup_epochs: 3.0
warmup_momentum: 0.8
warmup_bias_lr: 0.1

# Detection loss weights (DISABLED)
box: 0.0
cls: 0.0
obj: 0.0

# Additional detection parameters
cls_pw: 1.0
obj_pw: 1.0
iou_t: 0.2
anchor_t: 4.0
fl_gamma: 0.0

# Classification-specific parameters
cls_task: 1.0
label_smoothing: 0.1

# Class weights to fix PSAX bias bug
# A4C: 1.026, PSAX: 1.524, PLAX: 0.730
class_weights: [1.026, 1.524, 0.730]

# Data augmentation (DISABLED per project rules)
hsv_h: 0.0
hsv_s: 0.0
hsv_v: 0.0
degrees: 0.0
translate: 0.0
scale: 0.0
shear: 0.0
perspective: 0.0
flipud: 0.0
fliplr: 0.0
mosaic: 0.0
mixup: 0.0
copy_paste: 0.0
